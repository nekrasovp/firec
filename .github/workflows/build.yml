name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with warnings enabled
        run: make

      - name: Run tests
        run: make test

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      CFLAGS: >-
        -O1 -g -std=c11 -Wall -Wextra -Wpedantic
        -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build with sanitizers
        run: make

      - name: Run tests with sanitizers
        run: make test

  omz-fireplace:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Show Zsh version
        run: zsh --version

      - name: Validate Oh My Zsh fireplace adapter
        run: make test-omz

  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CFLAGS: -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show platform versions
        run: |
          uname -a
          clang --version
          zsh --version

      - name: Build with warnings as errors
        run: make

      - name: Verify macOS deployment target
        shell: bash
        run: |
          set -euo pipefail
          actual_target=$(
            otool -l ./fire |
              awk '
                $1 == "cmd" && $2 == "LC_BUILD_VERSION" {
                  in_build_version = 1
                  next
                }
                in_build_version && $1 == "minos" {
                  print $2
                  exit
                }
              '
          )
          printf 'macOS deployment target: %s\n' "$actual_target"
          test "$actual_target" = "$MACOSX_DEPLOYMENT_TARGET"

      - name: Run portable and PTY tests
        run: make test

      - name: Validate Oh My Zsh fireplace adapter
        run: make test-omz
