name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with warnings enabled
        run: make

      - name: Run tests
        run: make test

  sanitizers:
    runs-on: ubuntu-latest
    env:
      CFLAGS: >-
        -O1 -g -std=c11 -Wall -Wextra -Wpedantic
        -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build with sanitizers
        run: make

      - name: Run tests with sanitizers
        run: make test

  omz-fireplace:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Show Zsh version
        run: zsh --version

      - name: Validate Oh My Zsh fireplace adapter
        run: make test-omz
