name: release

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Makefile"
      - "fire.c"
      - "temperature.c"
      - "temperature.h"
      - "ui.c"
      - "ui.h"
      - "fireplace_frames.h"
      - "README.md"
      - "LICENSE"
      - "FIREPLACE_SOURCE.md"
      - "contrib/oh-my-zsh/**"
      - "tools/package_release.py"
      - "tests/test_package_release.py"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-packages:
    name: package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            compiler: gcc
            platform: linux-aarch64
          - os: macos-15-intel
            compiler: clang
            platform: macos-x86_64
          - os: macos-15
            compiler: clang
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: -O2 -std=c11 -Wall -Wextra -Wpedantic -Werror
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'invalid release tag: %s\n' "$GITHUB_REF_NAME" >&2
              exit 2
            fi
            package_version=$GITHUB_REF_NAME
          else
            package_version=ci-${GITHUB_SHA:0:12}
          fi
          source_date_epoch=$(git show --no-patch --format=%ct HEAD)
          printf 'PACKAGE_VERSION=%s\n' "$package_version" >> "$GITHUB_ENV"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$source_date_epoch" >> "$GITHUB_ENV"

      - name: Build with warnings as errors
        run: make

      - name: Run portable and PTY tests
        run: make test

      - name: Build reproducible release archive
        run: >-
          make dist
          VERSION="$PACKAGE_VERSION"
          PLATFORM="${{ matrix.platform }}"

      - name: Smoke-test packaged executable
        shell: bash
        run: |
          set -euo pipefail
          archive=dist/firec-${PACKAGE_VERSION}-${{ matrix.platform }}.tar.gz
          checksum=${archive}.sha256
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum --check "$(basename "$checksum")")
          else
            (cd dist && shasum -a 256 -c "$(basename "$checksum")")
          fi
          mkdir package-smoke
          tar -xzf "$archive" -C package-smoke
          package-smoke/firec-${PACKAGE_VERSION}-${{ matrix.platform }}/fire --help

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*.sha256
          --verify-tag
          --title "firec $GITHUB_REF_NAME"
          --generate-notes
